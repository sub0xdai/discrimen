name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install netcat
        run: sudo apt-get update -qq && sudo apt-get install -y -qq netcat-openbsd
      - name: offline suite
        run: ./run.sh
